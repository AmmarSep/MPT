<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Masjid Prayer Timings</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f1e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07110f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="MPT" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260923a" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="app-header-grid">
          <div class="app-header-main">
            <p class="app-eyebrow"><span lang="ar" dir="rtl">مواقيت الصلاة</span></p>
            <h1>Masjid Prayer Timings</h1>
            <div class="sync-controls">
              <p id="sync-status" class="sync-status" role="status" aria-live="polite"></p>
              <button id="sync-now-button" class="sync-now-button" type="button">Sync Now</button>
            </div>
          </div>
          <section class="sunrise-panel" aria-label="Sunrise time panel">
            <div class="sunrise-head">
              <svg class="sunrise-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 2v4" />
                <path d="m4.93 7.93 1.41 1.41" />
                <path d="M2 15h2" />
                <path d="M20 15h2" />
                <path d="m19.07 7.93-1.41 1.41" />
                <path d="M22 19H2" />
                <path d="M17 15a5 5 0 0 0-10 0" />
              </svg>
              <p class="sunrise-label">Sunrise</p>
              <span class="sunrise-arabic" lang="ar" dir="rtl" aria-hidden="true">الشروق</span>
            </div>
            <input
              id="sunrise-time-input"
              class="sunrise-time-input"
              type="time"
              value="06:00"
              aria-label="Sunrise time"
            />
          </section>
        </div>
      </header>
      <section id="masjid-list" class="masjid-list" aria-live="polite"></section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="config.js?v=20260905a"></script>
    <script src="script.js?v=20260905a"></script>
  </body>
</html>
